<!DOCTYPE html>
<html lang="pl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>SP Opatów - Aktualności</title>
  <style>
    img { max-width: 100%; height: auto; }
    body { overflow-wrap: break-word; }
  </style>
</head>
<body>
  <h1 id="feed-title">SP Opatów - Aktualności</h1>
  <main id="aktualnosci">Wczytywanie aktualności…</main>
  <script>
    (async () => {
      const ns = "http://www.w3.org/2005/Atom";
      const main = document.getElementById("aktualnosci");
      const element = (parent, name) => Array.from(parent.children).find(child => child.namespaceURI === ns && child.localName === name);
      const value = (parent, name) => element(parent, name)?.textContent || "";
      try {
        const response = await fetch("./aktualnosci.xml", {cache: "no-store"});
        if (!response.ok) throw new Error("Błąd pobierania XML: " + response.status);
        const xml = new DOMParser().parseFromString(await response.text(), "application/xml");
        if (xml.querySelector("parsererror")) throw new Error("Nieprawidłowy plik XML");
        const feed = xml.documentElement;
        document.getElementById("feed-title").textContent = value(feed, "title");
        document.title = value(feed, "title");
        const entries = Array.from(feed.children).filter(child => child.namespaceURI === ns && child.localName === "entry");
        main.replaceChildren();
        for (const entry of entries) {
          const article = document.createElement("article");
          const heading = document.createElement("h2");
          const title = document.createElement("a");
          const link = Array.from(entry.children).find(child => child.namespaceURI === ns && child.localName === "link" && child.getAttribute("rel") === "alternate");
          if (link) title.href = link.getAttribute("href") || "#";
          title.textContent = value(entry, "title");
          heading.appendChild(title);
          article.appendChild(heading);
          const updated = value(entry, "updated");
          if (updated) {
            const time = document.createElement("time");
            time.dateTime = updated;
            time.textContent = new Date(updated).toLocaleDateString("pl-PL", {year: "numeric", month: "long", day: "numeric", timeZone: "Europe/Warsaw"});
            article.appendChild(time);
          }
          const content = document.createElement("div");
          content.innerHTML = value(entry, "content");
          for (const unsafe of content.querySelectorAll("script, iframe, object, embed, form")) unsafe.remove();
          for (const node of content.querySelectorAll("*")) {
            for (const attr of Array.from(node.attributes)) {
              if (/^on/i.test(attr.name)) node.removeAttribute(attr.name);
              if (/^(href|src|action)$/i.test(attr.name) && /^\s*javascript:/i.test(attr.value)) node.removeAttribute(attr.name);
            }
          }
          article.appendChild(content);
          main.appendChild(article);
        }
      } catch (error) {
        main.textContent = "Nie udało się wyświetlić aktualności z pliku XML.";
        console.error(error);
      }
    })();
  </script>
</body>
</html>
